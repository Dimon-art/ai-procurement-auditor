<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Procurement Auditor{% endblock %}</title>

    <style>
        :root {
            --green: #14532d;
            --green-hover: #166534;
            --green-light: #dcfce7;
            --green-border: #bbf7d0;

            --accent: #f59e0b;
            --accent-dark: #b45309;
            --accent-light: #fef3c7;
            --accent-border: #fcd34d;

            --text: #1f2937;
            --muted: #4b5563;

            --background: #f5f7f6;
            --surface: #ffffff;
            --border: #e5e7eb;

            --shadow: 0 2px 10px rgba(0, 0, 0, 0.04);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--background);
            color: var(--text);
            font-family:
                Inter,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
        }

        a {
            color: inherit;
            text-decoration: none;
        }

        button {
            font: inherit;
        }

        .top-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 18px 32px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            color: var(--green);
            font-size: 18px;
            font-weight: 700;
            line-height: 1.2;
        }

        .nav-link {
            color: var(--muted);
            font-size: 14px;
        }

        .nav-link:hover {
            color: var(--green);
        }

        .page-wrap {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 65px);
            padding: 32px 16px;
        }

        .card {
            width: 100%;
            max-width: 520px;
            padding: 32px;
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 12px;
            box-shadow: var(--shadow);
        }

        .card-wide {
            max-width: 640px;
        }

        .page-title {
            margin: 0;
            font-size: 28px;
            line-height: 1.2;
            color: var(--text);
        }

        .page-description {
            margin: 12px 0 0;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.6;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 28px;
        }

        .primary-button,
        .secondary-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 140px;
            padding: 11px 18px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border: 0;
        }

        .primary-button {
            background: var(--green);
            color: white;
            box-shadow: var(--shadow);
        }

        .primary-button:hover {
            background: var(--green-hover);
        }

        .secondary-button {
            background: white;
            color: var(--green);
            border: 1px solid var(--border);
        }

        .secondary-button:hover {
            background: var(--green-light);
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            font-weight: 600;
            color: var(--text);
        }

        .form-input {
            display: block;
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            font: inherit;
            color: var(--text);
        }

        .form-input:focus {
            outline: 2px solid var(--green-border);
            border-color: var(--green);
        }

        .error-message {
            margin: 0 0 16px;
            padding: 12px 14px;
            background: #fee2e2;
            border: 1px solid #fecaca;
            border-radius: 8px;
            color: #b91c1c;
            font-size: 14px;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin-top: 20px;
            font-size: 14px;
        }

        .footer-links a {
            color: var(--green);
            font-weight: 600;
        }

        .footer-links a.muted {
            color: var(--muted);
            font-weight: 500;
        }

        .footer-links a.muted:hover {
            color: var(--green);
        }

        @media (max-width: 640px) {
            .top-nav {
                padding: 16px;
            }

            .card {
                padding: 24px 20px;
            }

            .page-title {
                font-size: 24px;
            }

            .actions {
                flex-direction: column;
            }

            .primary-button,
            .secondary-button {
                width: 100%;
            }
        }
    </style>

    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="top-nav">
        <a class="brand-title" href="{% url 'home' %}">
            AI Procurement Auditor
        </a>

        {% block nav_links %}
            <a class="nav-link" href="{% url 'login' %}">
                Войти
            </a>
        {% endblock %}
    </header>

    <main class="page-wrap">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
