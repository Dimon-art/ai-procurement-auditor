<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Загрузка документа</title>
</head>

<body>
    <h1>Загрузка документа</h1>

    {% if uploaded_document %}
        <p>
            Документ загружен:
            {{ uploaded_document.filename }}
        </p>

        <p>
            Статус:
            {{ uploaded_document.status }}
        </p>
    {% endif %}


    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}

        <div>
            <label for="company">
                Компания:
            </label>

            <select name="company" id="company" required>
                {% for company in companies %}
                    <option value="{{ company.id }}">
                        {{ company.name }}
                    </option>
                {% endfor %}
            </select>
        </div>


        <div>
            <label for="document">
                Документ:
            </label>

            <input
                type="file"
                name="document"
                id="document"
                accept=".jpg,.jpeg,.png,.pdf"
                required
            >
        </div>


        <button type="submit">
            Загрузить
        </button>
    </form>

</body>
</html>
