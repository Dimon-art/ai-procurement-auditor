<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents — AI Procurement Auditor</title>
</head>
<body>
    <h1>Documents</h1>

    <p>
        User:
        {{ request.user.username }}
    </p>

    <p>
        <a href="{% url 'document-upload' %}">
            Upload document
        </a>
    </p>

    {% if documents %}
        <ul>
            {% for document in documents %}
                <li>
                    <strong>{{ document.filename }}</strong>
                    — {{ document.status }}
                </li>
            {% endfor %}
        </ul>
    {% else %}
        <p>Documents пока не загружены.</p>
    {% endif %}

    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">
            Logout
        </button>
    </form>
</body>
</html>
