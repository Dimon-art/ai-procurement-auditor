<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — AI Procurement Auditor</title>
</head>
<body>
    <h1>AI Procurement Auditor</h1>

    <h2>Вход</h2>

    {% if form.errors %}
        <p>Неверное имя пользователя или пароль.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <div>
            <label for="{{ form.username.id_for_label }}">
                Имя пользователя
            </label>

            {{ form.username }}
        </div>

        <div>
            <label for="{{ form.password.id_for_label }}">
                Пароль
            </label>

            {{ form.password }}
        </div>

        <button type="submit">
            Войти
        </button>
    </form>
</body>
</html>
